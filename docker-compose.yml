# Optional isolated Postgres for npm run dev:local-stack — NOT used by default dev (prod DB via prod API).
#
# Postgres is NOT a website: port 5433 is the DB wire protocol only (browser → ERR_EMPTY_RESPONSE).
# Web UI: start adminer and open http://localhost:5050 — System: PostgreSQL, Server: postgres,
# User: postgres, Password: password, Database: postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: krunch-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      # 5433 avoids conflict when another Postgres (e.g. Herd) already uses 5432
      - "5433:5432"
    volumes:
      - krunch-pos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: krunch-pos-adminer
    restart: unless-stopped
    ports:
      - "5050:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: krunch-pos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: krunch
      MINIO_ROOT_PASSWORD: krunchsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - krunch-pos-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: krunch-pos-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 krunch krunchsecret; do sleep 1; done;
      mc mb --ignore-existing local/krunch-pos;
      exit 0;
      "

volumes:
  krunch-pos-pgdata:
  krunch-pos-minio:
