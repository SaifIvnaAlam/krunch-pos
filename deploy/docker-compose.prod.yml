# Production stack: Postgres + API (+ one-shot bucket-init). TLS/routing and the
# POS static build are handled by the shared host Caddy (see deploy/krunch.caddy),
# and object storage uses the shared MinIO on the VPS.
# Run from deploy/ with: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
name: krunch-pos

x-dns: &default_dns
  dns:
    - 212.227.123.16
    - 8.8.8.8

services:
  postgres:
    <<: *default_dns
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [krunch]

  api:
    <<: *default_dns
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: always
    # Published on loopback only; the shared host Caddy reverse-proxies /api/* here.
    ports:
      - "127.0.0.1:3001:3000"
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      REDIS_DISABLED: "true"
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PRESIGN_EXPIRY_SECONDS: ${S3_PRESIGN_EXPIRY_SECONDS:-900}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://s3.storage.inventivelab.bd/media}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [krunch]

  # No dedicated Caddy here — the shared host Caddy on the VPS (systemd) fronts
  # 80/443 for OneSign, n8n, and Krunch. It reverse-proxies steakandmarrow.* to
  # the API on 127.0.0.1:3001 and serves the POS build from deploy/pos-static.
  # See deploy/krunch.caddy (installed into /etc/caddy/conf.d by the deploy script).

  # No local MinIO — storage uses the shared MinIO already running on the VPS
  # (S3_ENDPOINT). This one-shot job just ensures the krunch-pos bucket exists.
  bucket-init:
    <<: *default_dns
    image: minio/mc:latest
    restart: "no"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set shared $$S3_ENDPOINT $$S3_ACCESS_KEY $$S3_SECRET_KEY;
      mc mb --ignore-existing shared/$$S3_BUCKET;
      mc anonymous set none shared/$$S3_BUCKET;
      echo Bucket $$S3_BUCKET ready on $$S3_ENDPOINT;
      "
    networks: [krunch]

  # Existing automation — unchanged; not exposed on 80/443 by Caddy.
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${GENERIC_TIMEZONE:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-local-files:/files
    networks: [krunch]

volumes:
  pg_data:
  n8n_data:

networks:
  krunch:
    driver: bridge
